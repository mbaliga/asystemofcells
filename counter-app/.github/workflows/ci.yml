name: ci
on: { push: { branches: [main] }, pull_request: {} }
jobs:
  core:
    # :core is pure JVM: runs on a bare JDK, no Android SDK. The parity tests check the Kotlin state machine and
    # pricing against fixtures produced by the real server code (tools/gen-fixtures.mjs).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      - run: ./gradlew :core:test --console=plain
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      - uses: android-actions/setup-android@v3
      - run: ./gradlew :core:test :app:assembleDebug --console=plain
      - uses: actions/upload-artifact@v4
        with: { name: counter-debug-apk, path: app/build/outputs/apk/debug/*.apk }
